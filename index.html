<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Tabs - Chattto</title>
  <style>
    :root {
      color-scheme: dark;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --color-bg: #171614;
      --color-surface: #1d1c1a;
      --color-surface-2: #23221f;
      --color-surface-offset: #2a2926;
      --color-border: rgba(255,255,255,0.08);
      --color-text: #ecebe8;
      --color-text-muted: #aaaaa4;
      --color-text-faint: #7a7872;
      --color-primary: #7c8cff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.34), 0 16px 32px rgba(0,0,0,0.22);
    }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 24px;
      gap: 20px;
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title { font-size: 20px; font-weight: bold; color: var(--color-text); }
    .date { color: var(--color-text-muted); font-size: 13px; }
    .subtitle { font-size: 13px; color: var(--color-text-faint); margin-top: 4px; }
    
    #qr-container {
      background: white;
      padding: 8px;
      border-radius: var(--radius-sm);
      display: none;
      flex-shrink: 0;
    }
    #qr-container img, #qr-container canvas {
      display: block;
      max-width: 110px !important;
      height: auto !important;
    }
    
    .tab-list {
      list-style: none;
      padding: 0;
      margin: 0;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }
    .tab-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 160ms ease;
    }
    .tab-item:hover { background: var(--color-surface-offset); }
    .tab-item:last-child { border-bottom: none; }
    .tab-link {
      text-decoration: none;
      color: var(--color-text);
      font-size: 14px;
      word-break: break-all;
    }
    .tab-link:hover { color: var(--color-primary); }
    .favicon { width: 16px; height: 16px; border-radius: 2px; }
    
    #loading, #error { text-align: center; padding: 40px; color: var(--color-text-muted); }
    #error { color: #e76a6a; display: none; }

    @media (max-width: 600px) {
      body { margin: 20px auto; padding: 0 15px; }
      .header { flex-direction: column; align-items: center; text-align: center; }
      .header-info { align-items: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-info">
        <div class="title" id="session-name">Loading Shared Session...</div>
        <div class="date" id="session-date"></div>
        <div class="subtitle">
          Scan the QR code with your phone to open this session on mobile.
        </div>
      </div>
      <div id="qr-container"></div>
    </div>

    <div id="loading">Fetching tabs...</div>
    <div id="error">Could not load the shared session. It may have expired or the link is invalid.</div>
    
    <ul class="tab-list" id="tab-list" style="display: none;"></ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    function loadSession() {
      const urlParams = new URLSearchParams(window.location.search);
      const dataStr = urlParams.get('data');

      if (!dataStr) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        return;
      }

      try {
        const decompressed = LZString.decompressFromEncodedURIComponent(dataStr);
        const data = JSON.parse(decompressed);
        
        // Handle minified properties and fallback to old properties
        const sessionName = data.n || data.name || 'Shared Session';
        const sessionDate = data.c || data.createdAt;
        const tabsArray = data.t ? data.t.map(arr => ({ url: arr[0], title: arr[1] })) : (data.tabs || []);

        document.getElementById('session-name').textContent = sessionName;
        document.getElementById('session-date').textContent = new Date(sessionDate).toLocaleString();
        
        // Generate QR code for the current URL
        const qrContainer = document.getElementById('qr-container');
        qrContainer.style.display = 'block';
        new QRCode(qrContainer, {
          text: window.location.href,
          width: 128,
          height: 128,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.L
        });

        // If on mobile, move the QR container to the very bottom
        if (window.innerWidth <= 600 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          const container = document.querySelector('.container');
          qrContainer.style.margin = '30px auto 0';
          container.appendChild(qrContainer);
        }

        const list = document.getElementById('tab-list');
        list.style.display = 'block';

        tabsArray.forEach(tab => {
          const li = document.createElement('li');
          li.className = 'tab-item';
          
          const img = document.createElement('img');
          img.className = 'favicon';
          try {
            const urlObj = new URL(tab.url);
            img.src = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
          } catch(e) {
            img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23ddd"/><text y="50%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="50">🌐</text></svg>';
          }

          const a = document.createElement('a');
          a.className = 'tab-link';
          a.href = tab.url;
          a.textContent = tab.title || tab.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          li.appendChild(img);
          li.appendChild(a);
          list.appendChild(li);
        });

        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    loadSession();
  </script>
</body>
</html>
