<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Tabs - Chattto</title>
  <style>
    :root {
      color-scheme: dark;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --color-bg: #171614;
      --color-surface: #1d1c1a;
      --color-surface-2: #23221f;
      --color-surface-offset: #2a2926;
      --color-border: rgba(255,255,255,0.08);
      --color-text: #ecebe8;
      --color-text-muted: #aaaaa4;
      --color-text-faint: #7a7872;
      --color-primary: #7c8cff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.34), 0 16px 32px rgba(0,0,0,0.22);
    }
    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 24px;
      gap: 20px;
    }
    .header-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .title { font-size: 20px; font-weight: bold; color: var(--color-text); }
    .date { color: var(--color-text-muted); font-size: 13px; }
    .subtitle { font-size: 13px; color: var(--color-text-faint); margin-top: 4px; }
    
    #qr-container {
      background: white;
      padding: 16px;
      border-radius: var(--radius-sm);
      display: none;
      flex-shrink: 0;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #qr-container img, #qr-container canvas {
      display: block;
      max-width: 110px !important;
      height: auto !important;
    }
    
    .tab-list {
      list-style: none;
      padding: 0;
      margin: 0;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }
    .tab-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 160ms ease;
    }
    .tab-item:hover { background: var(--color-surface-offset); }
    .tab-item:last-child { border-bottom: none; }
    .tab-link {
      text-decoration: none;
      color: var(--color-text);
      font-size: 14px;
      word-break: break-all;
    }
    .tab-link:hover { color: var(--color-primary); }
    .favicon { width: 16px; height: 16px; border-radius: 2px; }
    
    #loading, #error { text-align: center; padding: 40px; color: var(--color-text-muted); }
    #error { color: #e76a6a; display: none; }

    .action-btn {
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 160ms;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-btn:hover { background: var(--color-surface-offset); }
    .action-btn.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    .action-btn.primary:hover { background: #6475ff; }
    
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      display: none;
    }

    .top-nav {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #000000;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: #ffffff;
      font-family: sans-serif;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .logo-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--color-text);
      line-height: 1;
    }
    .logo-subtitle {
      font-size: 11px;
      color: var(--color-text-faint);
      margin-top: 3px;
    }

    @media (max-width: 600px) {
      body { margin: 20px auto; padding: 0 15px; }
      .header { flex-direction: column; align-items: center; text-align: center; }
      .header-info { align-items: center; }
      .top-nav { justify-content: center; margin-bottom: 24px; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <div class="logo-container">
      <div class="logo-icon">K</div>
      <div class="logo-text">
        <div class="logo-title">Chattto</div>
        <div class="logo-subtitle">Tab Manager</div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="header-info">
        <div class="title" id="session-name">Loading Shared Session...</div>
        <div class="date" id="session-date"></div>
        <div class="subtitle">
          Scan the QR code with your phone to open this session on mobile.
        </div>
      </div>
      <div id="qr-container"></div>
    </div>

    <div id="loading">Fetching tabs...</div>
    <div id="error">Could not load the shared session. It may have expired or the link is invalid.</div>
    
    <div class="list-header" id="list-header">
      <div style="font-size: 14px; color: var(--color-text-muted);"><span id="tab-count"></span> tabs</div>
      <button class="action-btn" onclick="copyAllLinks()">📋 Copy all links</button>
    </div>
    <ul class="tab-list" id="tab-list" style="display: none;"></ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    async function loadSession() {
      const urlParams = new URLSearchParams(window.location.search);
      const dataStr = urlParams.get('data');
      const shortId = urlParams.get('id');

      if (!dataStr && !shortId) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        return;
      }

      let data;
      try {
        if (shortId) {
          // Cloudflare API Fetch
          const res = await fetch(`https://chattto-api.chatttoviewer.workers.dev/${shortId}`);
          if (!res.ok) throw new Error('Session not found or expired');
          data = await res.json();
        } else if (dataStr) {
          // Fallback for old compressed URLs
          const decompressed = LZString.decompressFromEncodedURIComponent(dataStr);
          data = JSON.parse(decompressed);
        }

        if (!data) throw new Error('No data');
        
        // Handle minified properties and fallback to old properties
        const sessionName = data.n || data.name || 'Shared Session';
        const sessionDate = data.c || data.createdAt;
        const tabsArray = data.t ? data.t.map(arr => ({ url: arr[0], title: arr[1] })) : (data.tabs || []);

        document.getElementById('session-name').textContent = sessionName;
        document.getElementById('session-date').textContent = new Date(sessionDate).toLocaleString();
        
        // Generate QR code for the current URL
        const qrContainer = document.getElementById('qr-container');
        qrContainer.style.display = 'flex';
        const qrDiv = document.createElement('div');
        new QRCode(qrDiv, {
          text: window.location.href,
          width: 160,
          height: 160,
          colorDark : "#000000",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.L
        });
        qrContainer.appendChild(qrDiv);

        const copyQrBtn = document.createElement('button');
        copyQrBtn.className = 'action-btn';
        copyQrBtn.innerHTML = '📋 Copy QR Image';
        copyQrBtn.onclick = () => copyQrCode(qrDiv);
        qrContainer.appendChild(copyQrBtn);

        // If on mobile, move the QR container to the very bottom
        if (window.innerWidth <= 600 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          const container = document.querySelector('.container');
          qrContainer.style.margin = '30px auto 0';
          container.appendChild(qrContainer);
        }

        const list = document.getElementById('tab-list');
        list.style.display = 'block';
        document.getElementById('list-header').style.display = 'flex';
        document.getElementById('tab-count').textContent = tabsArray.length;
        window.sessionTabsArray = tabsArray;

        tabsArray.forEach(tab => {
          const li = document.createElement('li');
          li.className = 'tab-item';
          
          const img = document.createElement('img');
          img.className = 'favicon';
          img.loading = 'lazy';
          try {
            const urlObj = new URL(tab.url);
            img.src = `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
          } catch(e) {
            img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23ddd"/><text y="50%" x="50%" dominant-baseline="middle" text-anchor="middle" font-size="50">🌐</text></svg>';
          }

          const a = document.createElement('a');
          a.className = 'tab-link';
          a.href = tab.url;
          a.textContent = tab.title || tab.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          li.appendChild(img);
          li.appendChild(a);
          list.appendChild(li);
        });

        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    async function copyAllLinks() {
      if (!window.sessionTabsArray) return;
      const text = window.sessionTabsArray.map(t => t.url).join('\n');
      try {
        await navigator.clipboard.writeText(text);
        alert('All links copied to clipboard!');
      } catch (err) {
        alert('Failed to copy links: ' + err);
      }
    }

    async function copyQrCode(qrDiv) {
      try {
        const canvas = qrDiv.querySelector('canvas');
        if (canvas) {
          canvas.toBlob(async (blob) => {
            try {
              const item = new ClipboardItem({ 'image/png': blob });
              await navigator.clipboard.write([item]);
              alert('QR Code image copied to clipboard!');
            } catch (err) {
              alert('Could not copy image. Your browser might not support it.');
            }
          });
        }
      } catch (err) {
        alert('Failed to copy QR code: ' + err);
      }
    }

    loadSession();
  </script>
</body>
</html>
